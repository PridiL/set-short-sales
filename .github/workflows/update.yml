name: update

# Weekday morning refresh of the SET short-sales dashboard.
#  - workflow_dispatch: the punctual 07:00 Bangkok Mon-Fri trigger from cron-job.org;
#    a run that finds nothing new skips the deploy, so extra dispatches are harmless
#  - schedule: 07:15 Bangkok Mon-Fri fallback (GitHub's own cron, often runs late);
#    does nothing if the 07:00 run already got the data
#  - push to index.html: republish the page as-is
on:
  schedule:
    - cron: "15 0 * * 1-5"
  workflow_dispatch:
    inputs:
      refetch:
        description: "Test: drop and rebuild the latest N dates"
        default: "0"
  push:
    branches: [main]
    paths: [index.html, "data/**", .github/workflows/update.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"

      - name: Install
        if: github.event_name != 'push'
        run: |
          pip install playwright websockets pandas
          python -m playwright install --with-deps chromium

      - name: Fetch SET short sales + TradingView prices
        if: github.event_name != 'push'
        run: |
          N="${{ github.event.inputs.refetch || '0' }}"
          if [ "$N" -gt 0 ]; then ls data/20*.json | sort | tail -n "$N" | xargs rm -v; fi
          python scripts/shortsales.py data --expect-fresh || {
            echo "first attempt failed - retrying in 120 s"; sleep 120;
            python scripts/shortsales.py data --expect-fresh; }

      - name: Commit new dates
        id: commit
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$(git status --porcelain data)" ]; then echo "nothing new"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -q -m "data $(python -c "import json;print(json.load(open('data/dates.json'))['dates'][0]['date'])")"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: .

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
